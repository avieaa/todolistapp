<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Focus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Focus</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#1c1f22;--mut:#8a9096;--line:#eceeef;--acc:#5f8a7a;--accl:#eef4f1;--red:#c4574a;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'Plus Jakarta Sans',-apple-system,system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 150px}
h1{font-size:24px;margin:4px 0 2px}h3{margin:0 0 12px;font-size:18px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:10px}label>*{margin-top:4px;color:var(--ink)}
.row{display:flex;gap:10px;align-items:flex-end}.row>*{flex:1}
.btn{background:var(--acc);color:#fff;border-radius:14px;padding:14px;font-weight:600;min-height:48px}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.red{color:var(--red)!important}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 16px;border-radius:999px;border:1px solid var(--line);font-weight:500;color:var(--mut)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:#f5f6f6;font-size:13px;color:var(--mut)}.chip.on{background:var(--accl);color:var(--acc);font-weight:600}
.card{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #cfd4d6;margin-top:1px;display:grid;place-items:center;color:#fff;font-size:14px}
.done .chk{background:var(--acc);border-color:var(--acc)}.done .tt{text-decoration:line-through;color:var(--mut)}
.body{flex:1;min-width:0}.tt{font-weight:600;word-break:break-word}.hi{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--mut);margin-top:4px}.od{color:var(--red)}
.st{padding:2px 9px;border-radius:999px;background:var(--accl);color:var(--acc);font-weight:600}
.box{background:var(--accl);border-radius:var(--r);padding:16px;margin-bottom:16px}
.big{font-size:34px;font-weight:700;color:var(--acc);line-height:1}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.calh button{width:40px;height:40px;font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-bottom:18px}.cal i{font-style:normal;font-size:11px;color:var(--mut);padding:4px}
.cal button{height:42px;border-radius:12px;position:relative}.cal .tod{font-weight:700;color:var(--acc)}.cal .sel{background:var(--ink);color:#fff}
.cal u{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc)}.cal .sel u{background:#fff}
.empty{text-align:center;color:var(--mut);padding:36px 10px}.empty b{display:block;color:var(--ink);margin-bottom:4px}
.sk{height:64px;border-radius:var(--r);background:linear-gradient(90deg,#f3f4f4,#fafafa,#f3f4f4);background-size:200%;animation:sh 1.2s infinite;margin-bottom:10px}@keyframes sh{to{background-position:-200%}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fffffff2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 10px calc(env(safe-area-inset-bottom) + 6px);max-width:520px;margin:auto}
nav button{flex:1;padding:12px 0;font-size:13px;color:var(--mut);font-weight:500}nav .on{color:var(--acc);font-weight:700}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(env(safe-area-inset-bottom) + 76px);height:56px;padding:0 22px;border-radius:999px;background:var(--acc);color:#fff;font-weight:600;box-shadow:0 8px 24px #5f8a7a55}
#ov{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:5}#ov.on{display:flex}
#sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 20px);max-height:90vh;overflow:auto;animation:up .25s ease}@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-80px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:9;transition:.3s;max-width:90%}#toast.on{transform:translate(-50%,0)}#toast.bad{background:var(--red)}
.mrow{display:flex;gap:6px;margin-bottom:8px}.mrow button{width:44px;flex:none;border:1px solid var(--line);border-radius:12px}
.login{padding-top:12vh}
</style></head><body>
<div id="app"></div><div id="toast"></div><div id="ov"><div id="sheet"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== 1) PASTE YOUR SUPABASE VALUES HERE ======
const SB_URL='https://ppdovpvlsoyxacejklfj.supabase.co', SB_KEY='sb_publishable_JnGCNd2nPHrUKrELqxH8TA_VltDg2Zq';
// =================================================
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>ymd(new Date());
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('en',{day:'numeric',month:'short'});
const GROUPS=[['home','Home'],['primary','Primary Job'],['freelance','Freelance'],['side','Side Job']];
const STREAK=['freelance','side'],STAT=['draft','uploaded','approved'];
const S={sections:[],tasks:[],view:'today',grp:'home',sec:'all',q:'',date:'all',day:today(),month:new Date(),loading:true,user:null};
let tt;function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',2600)}
const sheet=h=>{$('#sheet').innerHTML=h;$('#ov').classList.add('on')},closeSheet=()=>$('#ov').classList.remove('on');
const secOf=id=>S.sections.find(s=>s.id===id)||{},groupOf=id=>secOf(id).grp;

async function seed(){const d=[['home','Chores','plain'],['primary','Work','plain'],['freelance','Projects','plain'],['side','Affiliate','affiliate'],['side','Adobe Stock','adobe']];
  await sb.from('sections').insert(d.map((x,i)=>({grp:x[0],name:x[1],kind:x[2],pos:i})))}
async function load(){
  const [a,b]=await Promise.all([sb.from('sections').select('*').order('pos'),sb.from('tasks').select('*').order('created_at',{ascending:false})]);
  if(a.error||b.error){S.loading=false;render();return toast('Could not load data. Check your connection.',1)}
  if(!a.data.length){await seed();return load()}
  S.sections=a.data;S.tasks=b.data;S.loading=false;render()}

function streaks(){const set=new Set(S.tasks.filter(t=>t.done&&t.done_at&&STREAK.includes(groupOf(t.section_id))).map(t=>ymd(t.done_at)));
  let cur=0,d=new Date();if(!set.has(ymd(d)))d.setDate(d.getDate()-1);while(set.has(ymd(d))){cur++;d.setDate(d.getDate()-1)}
  let best=0,run=0,prev=null;[...set].sort().forEach(k=>{let ok=false;if(prev){const p=new Date(prev+'T00:00');p.setDate(p.getDate()+1);ok=ymd(p)===k}run=ok?run+1:1;best=Math.max(best,run);prev=k});
  return{cur,best,today:set.has(today())}}
const sortT=(a,b)=>(a.done-b.done)||((b.priority==='high')-(a.priority==='high'))||String(a.due||'9').localeCompare(String(b.due||'9'));

function card(t){const s=secOf(t.section_id),od=t.due&&!t.done&&t.due<today();const m=[`<span>${esc(s.name)}</span>`];
  if(t.due)m.push(`<span class="${od?'od':''}">${fmt(t.due)}</span>`);
  if(s.kind==='affiliate'){if(t.platform)m.push(`<span>${esc(t.platform)}</span>`);if(t.target!=null)m.push(`<span>${t.target} posts</span>`)}
  if(s.kind==='adobe'&&t.status)m.push(`<button class="st" data-act="cyc" data-id="${t.id}">${t.status}</button>`);
  return `<div class="card ${t.done?'done':''}" data-act="edit" data-id="${t.id}"><button class="chk" data-act="tog" data-id="${t.id}" aria-label="Done">${t.done?'✓':''}</button>
  <div class="body"><div class="tt">${t.priority==='high'&&!t.done?'<span class="hi"></span>':''}${esc(t.title)}</div><div class="meta">${m.join('')}</div></div></div>`}
const empty=(a,b)=>`<div class="empty"><b>${a}</b>${b}</div>`;

function cal(){const m=S.month,y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate();
  const open=new Set(S.tasks.filter(t=>!t.done&&t.due).map(t=>t.due));
  let h=`<div class="calh"><button data-act="pm">‹</button><b>${m.toLocaleString('en',{month:'long',year:'numeric'})}</b><button data-act="nm">›</button></div><div class="cal">`+'SMTWTFS'.split('').map(d=>`<i>${d}</i>`).join('');
  for(let i=0;i<first;i++)h+='<span></span>';
  for(let d=1;d<=n;d++){const k=ymd(new Date(y,mo,d));h+=`<button data-act="day" data-d="${k}" class="${k===S.day?'sel':''} ${k===today()?'tod':''}">${d}${open.has(k)?'<u></u>':''}</button>`}
  return h+'</div>'}

function todayView(){const st=streaks(),T=today();
  const ts=S.tasks.filter(t=>t.due===S.day||(S.day===T&&!t.done&&t.due&&t.due<T)).sort(sortT);
  const msg=st.today?'Streak secured for today.':st.cur?`Finish one freelance or side job task today to keep your ${st.cur}-day streak.`:'Finish one freelance or side job task today to start a streak.';
  return `<h1>${S.day===T?'Today':fmt(S.day)}</h1><div class="sub">${new Date().toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long'})}</div>
  <div class="box"><div class="big">${st.cur}<span style="font-size:14px;font-weight:500;margin-left:6px">day streak</span></div><div class="sub" style="margin:8px 0 0">${msg}</div></div>
  ${cal()}${ts.length?ts.map(card).join(''):empty('Nothing scheduled','Tap + to add a task for this day.')}`}

function listHtml(){let ts=S.tasks.filter(t=>groupOf(t.section_id)===S.grp);const T=today();
  if(S.sec!=='all')ts=ts.filter(t=>t.section_id===S.sec);
  if(S.q)ts=ts.filter(t=>[t.title,t.notes,t.keywords,t.hashtags,t.platform].join(' ').toLowerCase().includes(S.q));
  const w=new Date();w.setDate(w.getDate()+7);
  if(S.date==='today')ts=ts.filter(t=>t.due===T);if(S.date==='overdue')ts=ts.filter(t=>!t.done&&t.due&&t.due<T);
  if(S.date==='week')ts=ts.filter(t=>t.due&&t.due>=T&&t.due<=ymd(w));if(S.date==='none')ts=ts.filter(t=>!t.due);
  return ts.length?ts.sort(sortT).map(card).join(''):empty('Nothing here yet',S.q||S.date!=='all'?'Try clearing the search or filter.':'Tap + to add your first task.')}
function listsView(){const secs=S.sections.filter(s=>s.grp===S.grp);
  return `<h1>Lists</h1><div class="tabs">${GROUPS.map(([g,n])=>`<button class="tab ${S.grp===g?'on':''}" data-act="grp" data-g="${g}">${n}</button>`).join('')}</div>
  <div class="tabs"><button class="chip ${S.sec==='all'?'on':''}" data-act="sec" data-id="all">All</button>${secs.map(s=>`<button class="chip ${S.sec===s.id?'on':''}" data-act="sec" data-id="${s.id}">${esc(s.name)}</button>`).join('')}<button class="chip" data-act="manage">Edit sections</button></div>
  <div class="row" style="margin-bottom:12px"><input id="q" type="search" placeholder="Search" value="${esc(S.q)}"><select id="dt"><option value="all">Any date</option>${[['today','Today'],['overdue','Overdue'],['week','Next 7 days'],['none','No date']].map(([v,n])=>`<option value="${v}" ${S.date===v?'selected':''}>${n}</option>`).join('')}</select></div>
  <div id="lst">${listHtml()}</div>`}
function insightsView(){const st=streaks(),T=today();const wk=new Date();wk.setDate(wk.getDate()-6);
  const done=S.tasks.filter(t=>t.done&&t.done_at&&STREAK.includes(groupOf(t.section_id))&&ymd(t.done_at)>=ymd(wk)).length;
  const od=S.tasks.filter(t=>!t.done&&t.due&&t.due<T).length,hi=S.tasks.filter(t=>!t.done&&t.priority==='high').length;
  const q=st.cur>=7?'A week or more of showing up. Keep the chain going.':st.cur>0?'Small and steady beats big and rare.':'One small task is enough to begin.';
  return `<h1>Insights</h1><div class="sub">${q}</div>
  <div class="box"><div class="big">${st.cur}</div><div class="sub" style="margin:6px 0 0">Current streak · best ${st.best} days<br>Freelance and Side Job only</div></div>
  <div class="row" style="margin-bottom:16px"><div class="box" style="margin:0"><div class="big">${done}</div><div class="sub" style="margin:6px 0 0">Done in last 7 days</div></div><div class="box" style="margin:0"><div class="big">${od}</div><div class="sub" style="margin:6px 0 0">Overdue</div></div></div>
  <div class="sub">${hi} high-priority task${hi===1?'':'s'} still open.</div><button class="btn ghost" style="width:100%;margin-top:20px" data-act="out">Sign out</button>`}

function render(){const a=$('#app');
  if(!S.user){a.innerHTML=`<div class="login"><h1>Focus</h1><div class="sub">Sign in to continue</div><label>Email<input id="em" type="email" autocomplete="username"></label><label>Password<input id="pw" type="password" autocomplete="current-password"></label><button class="btn" style="width:100%" data-act="login">Sign in</button></div>`;return}
  if(S.loading){a.innerHTML='<div class="sk"></div>'.repeat(5);return}
  a.innerHTML=(S.view==='today'?todayView():S.view==='lists'?listsView():insightsView())+
  `<button class="fab" data-act="new">+ Add task</button><nav>${[['today','Today'],['lists','Lists'],['ins','Insights']].map(([v,n])=>`<button class="${(S.view===v||(v==='ins'&&S.view==='insights'))?'on':''}" data-act="view" data-v="${v==='ins'?'insights':v}">${n}</button>`).join('')}</nav>`}

function openTask(id,def){const t=S.tasks.find(x=>x.id===id)||{};
  const sid=t.section_id||def||(S.sec!=='all'&&S.view==='lists'?S.sec:(S.sections.find(s=>s.grp===S.grp)||S.sections[0]).id);
  sheet(`<h3>${id?'Edit task':'New task'}</h3>
  <label>Section<select id="f_sec">${GROUPS.map(([g,n])=>`<optgroup label="${n}">${S.sections.filter(s=>s.grp===g).map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('')}</optgroup>`).join('')}</select></label>
  <label>Task<input id="f_title" maxlength="120" value="${esc(t.title)}" placeholder="What needs to be done?"></label>
  <div class="row"><label>Deadline<input id="f_due" type="date" value="${t.due||''}"></label><label>Priority<select id="f_pri"><option value="normal">Normal</option><option value="high" ${t.priority==='high'?'selected':''}>High</option></select></label></div>
  <div id="f_x"></div><label>Notes<textarea id="f_notes" rows="2">${esc(t.notes)}</textarea></label>
  <div class="row"><button class="btn" data-act="save" data-id="${id||''}">Save</button>${id?`<button class="btn ghost red" data-act="del" data-id="${id}">Delete</button>`:''}</div>`);
  const x=()=>{const k=secOf($('#f_sec').value).kind;$('#f_x').innerHTML=k==='affiliate'?`<div class="row"><label>Platform<input id="f_plat" value="${esc(t.platform)}" placeholder="Shopee"></label><label>Target posts<input id="f_tg" type="number" min="0" inputmode="numeric" value="${t.target??''}"></label></div>`:
    k==='adobe'?`<label>Keywords<textarea id="f_kw" rows="2" placeholder="comma, separated">${esc(t.keywords)}</textarea></label><div class="row"><label>Hashtags<input id="f_ht" value="${esc(t.hashtags)}"></label><label>Status<select id="f_stt">${STAT.map(s=>`<option ${s===(t.status||'draft')?'selected':''}>${s}</option>`).join('')}</select></label></div>`:''};
  $('#f_sec').onchange=x;x();if(!id)setTimeout(()=>$('#f_title').focus(),300)}

async function saveTask(id){const title=$('#f_title').value.trim();if(!title)return toast('Task name cannot be empty',1);
  const sid=$('#f_sec').value,k=secOf(sid).kind;
  const r={section_id:sid,title,due:$('#f_due').value||null,priority:$('#f_pri').value,notes:$('#f_notes').value.trim()||null,platform:null,target:null,keywords:null,hashtags:null,status:null};
  if(k==='affiliate'){r.platform=$('#f_plat').value.trim()||null;const v=$('#f_tg').value;if(v!==''){const n=Number(v);if(!Number.isInteger(n)||n<0)return toast('Target must be 0 or more',1);r.target=n}}
  if(k==='adobe'){r.keywords=$('#f_kw').value.trim()||null;r.hashtags=$('#f_ht').value.trim()||null;r.status=$('#f_stt').value}
  const res=id?await sb.from('tasks').update(r).eq('id',id):await sb.from('tasks').insert(r);
  if(res.error)return toast('Could not save: '+res.error.message,1);closeSheet();toast('Saved');load()}

function manage(){const l=S.sections.filter(s=>s.grp===S.grp),side=S.grp==='side';
  sheet(`<h3>${GROUPS.find(g=>g[0]===S.grp)[1]} sections</h3>${l.map(s=>`<div class="mrow"><input value="${esc(s.name)}" maxlength="40" data-act="ren" data-id="${s.id}"><button data-act="up" data-id="${s.id}">↑</button><button data-act="dn" data-id="${s.id}">↓</button><button class="red" data-act="dsec" data-id="${s.id}">✕</button></div>`).join('')}
  <div class="mrow" style="margin-top:14px"><input id="ns" maxlength="40" placeholder="New section name">${side?`<select id="nk" style="width:120px;flex:none"><option value="plain">Plain</option><option value="affiliate">Affiliate</option><option value="adobe">Stock</option></select>`:''}</div><button class="btn" style="width:100%" data-act="addsec">Add section</button>`)}
async function move(id,dir){const l=S.sections.filter(s=>s.grp===S.grp),i=l.findIndex(s=>s.id===id),j=i+dir;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];
  await Promise.all(l.map((s,p)=>sb.from('sections').update({pos:p}).eq('id',s.id)));await load();manage()}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(e.target.id==='ov')return closeSheet();if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==='tog'){e.stopPropagation();const t=S.tasks.find(x=>x.id===id),d=!t.done;t.done=d;t.done_at=d?new Date().toISOString():null;render();
    const r=await sb.from('tasks').update({done:d,done_at:t.done_at}).eq('id',id);if(r.error){toast('Could not update',1);load()}else if(d)toast('Done')}
  else if(a==='cyc'){e.stopPropagation();const t=S.tasks.find(x=>x.id===id);t.status=STAT[(STAT.indexOf(t.status)+1)%3];render();const r=await sb.from('tasks').update({status:t.status}).eq('id',id);if(r.error){toast('Could not update',1);load()}}
  else if(a==='edit')openTask(id);else if(a==='new')openTask(null,S.view==='today'?(S.sections[0]||{}).id:null);
  else if(a==='save')saveTask(id);
  else if(a==='del'){if(confirm('Delete this task? This cannot be undone.')){const r=await sb.from('tasks').delete().eq('id',id);if(r.error)return toast('Could not delete',1);closeSheet();toast('Deleted');load()}}
  else if(a==='view'){S.view=el.dataset.v;render()}else if(a==='grp'){S.grp=el.dataset.g;S.sec='all';render()}else if(a==='sec'){S.sec=id;render()}
  else if(a==='day'){S.day=el.dataset.d;render()}else if(a==='pm'||a==='nm'){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+(a==='nm'?1:-1),1);render()}
  else if(a==='manage')manage();else if(a==='up')move(id,-1);else if(a==='dn')move(id,1);
  else if(a==='addsec'){const n=$('#ns').value.trim();if(!n)return toast('Section name cannot be empty',1);const pos=Math.max(-1,...S.sections.map(s=>s.pos))+1;
    const r=await sb.from('sections').insert({grp:S.grp,name:n,kind:$('#nk')?$('#nk').value:'plain',pos});if(r.error)return toast('Could not add section',1);toast('Section added');await load();manage()}
  else if(a==='dsec'){const n=S.tasks.filter(t=>t.section_id===id).length;if(confirm(`Delete this section${n?` and its ${n} task${n>1?'s':''}`:''}? This cannot be undone.`)){const r=await sb.from('sections').delete().eq('id',id);if(r.error)return toast('Could not delete',1);S.sec='all';toast('Deleted');await load();manage()}}
  else if(a==='login'){const r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error)toast('Sign in failed: '+r.error.message,1)}
  else if(a==='out')sb.auth.signOut()});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.dataset.act==='ren'){const n=el.value.trim();if(!n){toast('Section name cannot be empty',1);return load()}const r=await sb.from('sections').update({name:n}).eq('id',el.dataset.id);r.error?toast('Could not rename',1):toast('Saved');load()}
  if(el.id==='dt'){S.date=el.value;$('#lst').innerHTML=listHtml()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value.trim().toLowerCase();$('#lst').innerHTML=listHtml()}});
sb.auth.onAuthStateChange((_,s)=>{S.user=s?.user||null;if(S.user){S.loading=true;render();load()}else render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
